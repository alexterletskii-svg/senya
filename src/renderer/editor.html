<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
  <title>Сеня — конструктор</title>
  <link rel="stylesheet" href="editor.css">
</head>
<body>
  <header>
    <b>senya@constructor:~$</b>
    <span id="status" class="dim"></span>
    <span class="spacer"></span>
    <button id="btn-mode" class="ghost" title="Простой режим для малышей">Режим: полный</button>
    <button id="btn-examples" class="ghost">Примеры</button>
    <button id="btn-save" class="ghost">Сохранить</button>
    <button id="btn-load" class="ghost">Загрузить</button>
    <input id="file" type="file" accept=".json,application/json" hidden>
    <button id="btn-run">Запустить правило</button>
    <button id="btn-stop" class="ghost">Стоп</button>
  </header>
  <div id="menu" hidden></div>
  <main>
    <aside id="palette"></aside>
    <section id="work"></section>
  </main>
  <footer id="problems"></footer>
  <script src="editor.js"></script>
</body>
</html>
